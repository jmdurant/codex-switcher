name: macOS checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --experimental-strip-types --test tests/*.test.ts
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin --bins
      - run: pnpm --dir ide-extension run package
      - name: Build unsigned app for local testing
        run: pnpm tauri build --debug --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
