name: Platform checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --experimental-strip-types --test tests/*.test.ts
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --bins
      - run: pnpm --dir ide-extension run package
      - name: Build unsigned app for local testing
        if: runner.os == 'macOS'
        run: pnpm tauri build --debug --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
